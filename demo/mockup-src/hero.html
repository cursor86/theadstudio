<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:720px; height:1280px;
    background: radial-gradient(circle at 50% 35%, #2b2d6e 0%, #0d0e2b 70%);
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:white; position:relative; overflow:hidden;
  }
  .ring { position:absolute; border-radius:50%; border:2px solid rgba(120,140,255,0.25); }
  .ring1 { width:520px; height:520px; }
  .ring2 { width:680px; height:680px; border-color:rgba(120,140,255,0.15); }
  .icon { font-size:220px; filter: drop-shadow(0 20px 40px rgba(80,100,255,0.5)); margin-bottom:20px; }
  .brand { letter-spacing:8px; font-size:28px; color:#8ea0ff; font-weight:700; margin-bottom:14px; }
  h1 { font-size:64px; font-weight:800; text-align:center; line-height:1.1; margin-bottom:16px; }
  p { font-size:30px; color:#c4cbff; text-align:center; max-width:560px; }
</style></head>
<body>
  <div class="ring ring2"></div>
  <div class="ring ring1"></div>
  <div class="icon">🎧</div>
  <div class="brand">NIMBUS AUDIO</div>
  <h1>Sound, Untethered</h1>
  <p>Premium wireless earbuds built for all-day listening</p>
</body></html>
