<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { height:100%; }
  body {
    width:720px; min-height:100vh;
    background: radial-gradient(circle at 50% 35%, #6EE7E7 0%, #2FB4C8 60%, #1A7FA0 100%);
    font-family: 'Comic Sans MS', 'Segoe UI', Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:white; position:relative; overflow:hidden;
  }
  .icon { font-size:200px; filter: drop-shadow(0 16px 30px rgba(0,60,70,0.35)); margin-bottom:20px; }
  .badge { background:rgba(255,255,255,0.25); border:2px solid rgba(255,255,255,0.55); border-radius:999px; padding:10px 28px; font-size:26px; font-weight:800; letter-spacing:1px; margin-bottom:24px; }
  h1 { font-size:68px; font-weight:800; text-align:center; line-height:1.1; margin-bottom:16px; text-shadow: 0 6px 0 rgba(0,60,70,0.25); }
  p { font-size:30px; color:#E3FBFB; text-align:center; max-width:560px; font-weight:600; }
</style></head>
<body>
  <div class="badge">LEARNING</div>
  <div class="icon">🧠✨</div>
  <h1>Boosts Creativity</h1>
  <p>Open-ended play that grows with your child</p>
</body></html>
