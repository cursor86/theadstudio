<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { height:100%; }
  body {
    width:720px; min-height:100vh;
    background: radial-gradient(circle at 50% 30%, #FFD93D 0%, #FF8C42 55%, #FF5D8F 100%);
    font-family: 'Comic Sans MS', 'Segoe UI', Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:white; position:relative; overflow:hidden;
  }
  .blob { position:absolute; border-radius:50%; background:rgba(255,255,255,0.18); }
  .b1 { width:260px; height:260px; top:-60px; left:-60px; }
  .b2 { width:180px; height:180px; bottom:40px; right:-40px; }
  .icon { font-size:210px; filter: drop-shadow(0 16px 30px rgba(120,40,0,0.35)); margin-bottom:10px; }
  .badge { background:rgba(255,255,255,0.28); border:2px solid rgba(255,255,255,0.6); border-radius:999px; padding:10px 30px; font-size:26px; font-weight:800; letter-spacing:1px; margin-bottom:22px; }
  h1 { font-size:74px; font-weight:800; text-align:center; line-height:1.08; margin-bottom:18px; text-shadow: 0 6px 0 rgba(120,40,0,0.25); }
  p { font-size:30px; color:#FFF3DA; text-align:center; max-width:580px; font-weight:600; }
</style></head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="badge">BRIGHT BUDDIES</div>
  <div class="icon">🧱🌈</div>
  <h1>Build. Imagine.<br/>Play.</h1>
  <p>Colorful building blocks made for little hands</p>
</body></html>
