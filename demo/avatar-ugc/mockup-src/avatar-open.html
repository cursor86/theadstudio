<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body {
    background: radial-gradient(circle at 50% 30%, #7d8ff0 0%, #4c3a8f 55%, #2a1b3d 100%);
    position:relative;
  }
  .backdrop-ring { position:absolute; border-radius:50%; border:3px solid rgba(255,255,255,0.12); }
  .r1 { width:900px; height:900px; top:120px; left:90px; }
  .r2 { width:1150px; height:1150px; top:20px; left:-35px; }

  /* Shoulders/bust (neck only - the shirt below covers the rest) */
  .bust {
    position:absolute; top:880px; left:130px; width:820px; height:1040px;
    background: linear-gradient(180deg, #ffd9b8 0%, #f4b98e 100%);
    border-radius:420px 420px 0 0;
  }
  /* Shirt covering the shoulders/torso */
  .shirt {
    position:absolute; top:965px; left:60px; width:960px; height:955px;
    background: linear-gradient(180deg, #4d3d78 0%, #2e2350 100%);
    border-radius:340px 340px 0 0;
  }
  .shirt-collar {
    position:absolute; top:965px; left:445px; width:190px; height:90px;
    background: linear-gradient(180deg, #ffd9b8 0%, #f4b98e 100%);
    border-radius:0 0 95px 95px;
  }
  /* Head */
  .head {
    position:absolute; top:440px; left:280px; width:520px; height:520px; border-radius:50%;
    background: linear-gradient(160deg, #ffe0c2 0%, #f6bd93 100%);
  }
  /* Hair: short rounded cap covering only the top third of the head */
  .hair-cap {
    position:absolute; top:395px; left:262px; width:556px; height:225px;
    border-radius:278px 278px 0 0;
    background: linear-gradient(160deg, #3a2a22 0%, #1f150f 100%);
  }
  .hair-side-l { position:absolute; top:560px; left:255px; width:90px; height:180px; border-radius:45px 0 0 45px; background:#241812; }
  .hair-side-r { position:absolute; top:560px; left:735px; width:90px; height:180px; border-radius:0 45px 45px 0; background:#241812; }

  .brow { position:absolute; top:660px; width:66px; height:14px; border-radius:8px; background:#3a2a22; }
  .brow-l { left:398px; transform:rotate(-6deg); }
  .brow-r { left:616px; transform:rotate(6deg); }

  .eye { position:absolute; top:695px; width:42px; height:42px; border-radius:21px; background:#2a1b12; }
  .eye-l { left:408px; }
  .eye-r { left:626px; }
  .eye-shine { position:absolute; top:702px; width:12px; height:12px; border-radius:50%; background:#fff; }
  .eye-shine-l { left:422px; }
  .eye-shine-r { left:640px; }

  .cheek { position:absolute; top:790px; width:70px; height:36px; border-radius:50%; background:rgba(255,150,130,0.35); }
  .cheek-l { left:345px; }
  .cheek-r { left:665px; }

  .mouth { position:absolute; top:830px; left:480px; width:120px; height:46px; border-radius:0 0 60px 60px; background:#c4544a; }
  .mouth-inner { position:absolute; top:834px; left:492px; width:96px; height:20px; border-radius:0 0 48px 48px; background:#7a2e28; }

  .mic-head { position:absolute; top:1620px; left:508px; width:64px; height:80px; border-radius:32px; background:#2c2138; }
  .mic { position:absolute; top:1700px; left:527px; width:26px; height:120px; border-radius:13px; background:#1f1524; box-shadow:0 0 0 6px rgba(255,255,255,0.06); }
</style></head>
<body>
  <div class="backdrop-ring r2"></div>
  <div class="backdrop-ring r1"></div>
  <div class="bust"></div>
  <div class="shirt"></div>
  <div class="shirt-collar"></div>
  <div class="head"></div>
  <div class="hair-side-l"></div>
  <div class="hair-side-r"></div>
  <div class="hair-cap"></div>
  <div class="cheek cheek-l"></div>
  <div class="cheek cheek-r"></div>
  <div class="brow brow-l"></div>
  <div class="brow brow-r"></div>
  <div class="eye eye-l"></div>
  <div class="eye eye-r"></div>
  <div class="eye-shine eye-shine-l"></div>
  <div class="eye-shine eye-shine-r"></div>
  <div class="mouth"></div>
  <div class="mouth-inner"></div>
  <div class="mic-head"></div>
  <div class="mic"></div>
</body></html>
