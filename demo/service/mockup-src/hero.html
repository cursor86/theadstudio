<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:720px; height:1280px;
    background: radial-gradient(circle at 50% 35%, #0e4a5a 0%, #061c24 70%);
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:white; position:relative; overflow:hidden;
  }
  .ring { position:absolute; border-radius:50%; border:2px solid rgba(100,220,255,0.2); }
  .ring1 { width:520px; height:520px; }
  .ring2 { width:680px; height:680px; border-color:rgba(100,220,255,0.12); }
  .icon { font-size:190px; filter: drop-shadow(0 20px 40px rgba(80,220,255,0.5)); margin-bottom:20px; }
  .brand { letter-spacing:6px; font-size:26px; color:#7fe3ff; font-weight:700; margin-bottom:14px; }
  h1 { font-size:60px; font-weight:800; text-align:center; line-height:1.1; margin-bottom:16px; }
  p { font-size:28px; color:#c0eeff; text-align:center; max-width:560px; }
</style></head>
<body>
  <div class="ring ring2"></div>
  <div class="ring ring1"></div>
  <div class="icon">🚗✨</div>
  <div class="brand">SPARKLE DETAILING</div>
  <h1>Your Car, Showroom Clean</h1>
  <p>Mobile detailing - we come to you</p>
</body></html>
