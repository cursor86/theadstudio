<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { height:100%; }
  body {
    width:720px; min-height:100vh;
    background: radial-gradient(circle at 50% 35%, #123f5a 0%, #071824 70%);
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:white; position:relative; overflow:hidden;
  }
  .icon { font-size:190px; filter: drop-shadow(0 20px 40px rgba(140,200,255,0.5)); margin-bottom:20px; }
  .badge { background:rgba(140,200,255,0.15); border:1px solid rgba(140,200,255,0.4); border-radius:999px; padding:10px 28px; font-size:26px; color:#b0d8ff; font-weight:700; margin-bottom:24px; }
  h1 { font-size:54px; font-weight:800; text-align:center; line-height:1.15; margin-bottom:16px; }
  p { font-size:28px; color:#d0e8ff; text-align:center; max-width:560px; }
</style></head>
<body>
  <div class="icon">🧽</div>
  <div class="badge">DEEP CLEAN</div>
  <h1>Interior &amp; Exterior Detailing</h1>
  <p>Hand wash, wax, and full interior shampoo every visit</p>
</body></html>
