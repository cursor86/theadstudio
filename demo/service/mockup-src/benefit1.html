<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:720px; height:1280px;
    background: radial-gradient(circle at 50% 35%, #12587a 0%, #072030 70%);
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:white; position:relative; overflow:hidden;
  }
  .icon { font-size:190px; filter: drop-shadow(0 20px 40px rgba(80,200,255,0.5)); margin-bottom:20px; }
  .badge { background:rgba(80,200,255,0.15); border:1px solid rgba(80,200,255,0.4); border-radius:999px; padding:10px 28px; font-size:26px; color:#8fdcff; font-weight:700; margin-bottom:24px; }
  h1 { font-size:60px; font-weight:800; text-align:center; line-height:1.1; margin-bottom:16px; }
  p { font-size:28px; color:#cceeff; text-align:center; max-width:560px; }
</style></head>
<body>
  <div class="icon">📍</div>
  <div class="badge">FULLY MOBILE</div>
  <h1>We Come To You</h1>
  <p>Home, office, or curbside - we bring the full setup</p>
</body></html>
