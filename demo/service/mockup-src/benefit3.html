<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:720px; height:1280px;
    background: radial-gradient(circle at 50% 35%, #5a4a0e 0%, #241d06 70%);
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:white; position:relative; overflow:hidden;
  }
  .icon { font-size:120px; letter-spacing:8px; filter: drop-shadow(0 20px 40px rgba(255,220,80,0.5)); margin-bottom:20px; }
  .badge { background:rgba(255,220,80,0.15); border:1px solid rgba(255,220,80,0.4); border-radius:999px; padding:10px 28px; font-size:26px; color:#ffe58a; font-weight:700; margin-bottom:24px; }
  h1 { font-size:58px; font-weight:800; text-align:center; line-height:1.1; margin-bottom:16px; }
  p { font-size:28px; color:#f5edcc; text-align:center; max-width:560px; }
</style></head>
<body>
  <div class="icon">⭐⭐⭐⭐⭐</div>
  <div class="badge">TRUSTED LOCALLY</div>
  <h1>5-Star Rated Service</h1>
  <p>Rated by 200+ happy customers in your area</p>
</body></html>
