<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { height:100%; }
  body {
    width:720px; min-height:100vh;
    background: radial-gradient(circle at 50% 35%, #6b3a10 0%, #2a1608 70%);
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:white; position:relative; overflow:hidden;
  }
  .icon { font-size:200px; filter: drop-shadow(0 20px 40px rgba(255,180,60,0.5)); margin-bottom:20px; }
  .badge { background:rgba(255,180,60,0.15); border:1px solid rgba(255,180,60,0.4); border-radius:999px; padding:10px 28px; font-size:26px; color:#ffcf8a; font-weight:700; margin-bottom:24px; }
  h1 { font-size:66px; font-weight:800; text-align:center; line-height:1.1; margin-bottom:16px; }
  p { font-size:28px; color:#f0d5c0; text-align:center; max-width:560px; }
</style></head>
<body>
  <div class="icon">🏷️</div>
  <div class="badge">OPENING WEEK</div>
  <h1>20% Off Your First Order</h1>
  <p>Valid opening weekend only - show this ad in store</p>
</body></html>
