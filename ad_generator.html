<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ad Studio - Product Ad Video Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .preview-box {
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="text-gray-800">
    <div id="root"></div>

    <script>
        const BACKEND_ORIGIN = '';
        const API_BASE = `${BACKEND_ORIGIN}/api`;
        
        let currentPage = 'landing';
        let formData = {
            title: '',
            features: '',
            cta: 'Order Now',
            image: null,
            imagePreview: null
        };
        let isGenerating = false;

        let adMode = 'classic';
        let ugcData = {
            script: '',
            scriptTitle: '',
            scriptFeatures: '',
            scriptCta: '',
            avatarId: '',
            voiceId: '',
            aspectRatio: '9:16',
            avatars: [],
            voiceOptions: [],
            avatarsLoaded: false,
            avatarsError: null,
            jobId: null,
            status: null, // pending | in_queue | running | done | failed
            videoUrl: null,
            error: null
        };
        let montageData = {
            title: '',
            features: '',
            cta: 'Shop Now',
            link: 'yourstore.com',
            duration: '', // seconds, blank = default (follows music length, 25-30s)
            images: [],
            imagePreviews: [],
            music: null,
            musicName: ''
        };

        function switchMode(mode) {
            adMode = mode;
            render();
            if (mode === 'ugc' && !ugcData.avatarsLoaded) {
                loadCreatifyPickers();
            }
        }

        async function loadCreatifyPickers() {
            try {
                const [avatarsRes, voicesRes] = await Promise.all([
                    fetch(`${API_BASE}/avatars`),
                    fetch(`${API_BASE}/voices`)
                ]);
                const avatars = await avatarsRes.json();
                const voices = await voicesRes.json();

                if (!avatarsRes.ok) throw new Error(avatars.error || 'Failed to load avatars');

                ugcData.avatars = Array.isArray(avatars) ? avatars : [];
                ugcData.voiceOptions = voicesRes.ok && Array.isArray(voices)
                    ? voices.flatMap(v => (v.accents || []).map(a => ({
                        id: a.id,
                        label: `${v.name || 'Voice'} - ${a.accent_name || ''}`.trim()
                    })))
                    : [];
                if (ugcData.avatars.length > 0 && !ugcData.avatarId) {
                    ugcData.avatarId = ugcData.avatars[0].id || ugcData.avatars[0].avatar_id || '';
                }
                ugcData.avatarsLoaded = true;
                ugcData.avatarsError = null;
            } catch (error) {
                console.error('❌ Error loading Creatify avatars/voices:', error);
                ugcData.avatarsLoaded = true;
                ugcData.avatarsError = error.message;
            }
            render();
        }

        function generateUgcScript() {
            const title = ugcData.scriptTitle.trim();
            const features = ugcData.scriptFeatures.split(',').map(f => f.trim()).filter(Boolean).slice(0, 3);
            const cta = ugcData.scriptCta.trim();

            if (!title && features.length === 0) {
                alert('❌ Add a product name or a few features first');
                return;
            }

            let script = '';
            if (title) script += `Okay so I have to talk about ${title} for a second. `;
            if (features.length > 0) script += `Honestly my favorite things about it: ${features.join(', ')}. `;
            script += `If you've been on the fence, ${cta || 'check it out'} — you will not regret it.`;

            ugcData.script = script;
            render();
        }

        async function generateUgc() {
            try {
                if (!ugcData.script.trim()) {
                    alert('❌ Please write a script for the avatar to speak');
                    return;
                }
                if (!ugcData.avatarId) {
                    alert('❌ Please choose an avatar');
                    return;
                }

                isGenerating = true;
                ugcData.status = 'pending';
                ugcData.videoUrl = null;
                ugcData.error = null;
                render();

                const formDataObj = new FormData();
                formDataObj.append('script', ugcData.script);
                formDataObj.append('avatar_id', ugcData.avatarId);
                if (ugcData.voiceId) formDataObj.append('voice_id', ugcData.voiceId);
                formDataObj.append('aspect_ratio', ugcData.aspectRatio);

                const response = await fetch(`${API_BASE}/generate-ugc`, {
                    method: 'POST',
                    body: formDataObj
                });
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to start UGC avatar video');
                }

                ugcData.jobId = result.job_id;
                ugcData.status = result.status;
                render();
                pollUgcStatus();

            } catch (error) {
                console.error('❌ Error:', error);
                ugcData.error = error.message;
                ugcData.status = 'failed';
                isGenerating = false;
                render();
            }
        }

        async function pollUgcStatus() {
            if (!ugcData.jobId) return;
            try {
                const response = await fetch(`${API_BASE}/ugc-status/${ugcData.jobId}`);
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to check status');
                }

                ugcData.status = result.status;

                if (result.status === 'done') {
                    ugcData.videoUrl = `${BACKEND_ORIGIN}${result.video_url}`;
                    isGenerating = false;
                    render();
                    return;
                }

                if (result.status === 'failed') {
                    ugcData.error = result.error || 'Render failed';
                    isGenerating = false;
                    render();
                    return;
                }

                render();
                setTimeout(pollUgcStatus, 5000);

            } catch (error) {
                console.error('❌ Error polling UGC status:', error);
                ugcData.error = error.message;
                isGenerating = false;
                render();
            }
        }

        function handleMontageImagesUpload(e) {
            const files = Array.from(e.target.files);
            montageData.images = files;
            montageData.imagePreviews = [];
            render();
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    montageData.imagePreviews.push(event.target.result);
                    render();
                };
                reader.readAsDataURL(file);
            });
        }

        function handleMusicUpload(e) {
            const file = e.target.files[0];
            if (file) {
                montageData.music = file;
                montageData.musicName = file.name;
                render();
            }
        }

        async function generateMontage() {
            try {
                if (montageData.images.length === 0 || !montageData.music) {
                    alert('❌ Please upload at least one image and a music track');
                    return;
                }

                isGenerating = true;
                render();

                const formDataObj = new FormData();
                montageData.images.forEach(img => formDataObj.append('images', img));
                formDataObj.append('music', montageData.music);
                formDataObj.append('title', montageData.title);
                formDataObj.append('features', montageData.features);
                formDataObj.append('cta', montageData.cta);
                formDataObj.append('link', montageData.link);
                if (montageData.duration) formDataObj.append('duration', montageData.duration);

                console.log('🚀 Sending montage request to backend...');

                const response = await fetch(`${API_BASE}/generate-montage`, {
                    method: 'POST',
                    body: formDataObj
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to generate montage');
                }

                console.log('✅ Montage generated!', result);
                currentPage = 'success';
                formData.videoUrl = `${BACKEND_ORIGIN}${result.video_url}`;
                isGenerating = false;
                render();

                setTimeout(() => {
                    window.location.href = formData.videoUrl;
                }, 2000);

            } catch (error) {
                console.error('❌ Error:', error);
                alert('❌ Error: ' + error.message);
                isGenerating = false;
                render();
            }
        }

        async function generateAd() {
            try {
                if (!formData.title || !formData.features || !formData.image) {
                    alert('❌ Please fill all fields and upload an image');
                    return;
                }

                isGenerating = true;
                render();

                const formDataObj = new FormData();
                formDataObj.append('title', formData.title);
                formDataObj.append('features', formData.features);
                formDataObj.append('cta', formData.cta);
                formDataObj.append('image', formData.image);

                console.log('🚀 Sending request to backend...');

                const response = await fetch(`${API_BASE}/generate-ad`, {
                    method: 'POST',
                    body: formDataObj
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to generate ad');
                }

                console.log('✅ Ad generated!', result);
                currentPage = 'success';
                formData.videoUrl = `${BACKEND_ORIGIN}${result.video_url}`;
                isGenerating = false;
                render();

                // Auto-download
                setTimeout(() => {
                    window.location.href = formData.videoUrl;
                }, 2000);

            } catch (error) {
                console.error('❌ Error:', error);
                alert('❌ Error: ' + error.message);
                isGenerating = false;
                render();
            }
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                formData.image = file;
                const reader = new FileReader();
                reader.onload = (event) => {
                    formData.imagePreview = event.target.result;
                    render();
                };
                reader.readAsDataURL(file);
            }
        }

        function render() {
            const root = document.getElementById('root');

            // Landing Page
            if (currentPage === 'landing') {
                root.innerHTML = `
                    <div class="min-h-screen">
                        <!-- Header -->
                        <nav class="bg-white shadow-lg">
                            <div class="max-w-6xl mx-auto px-8 py-6 flex justify-between items-center">
                                <div class="text-2xl font-bold gradient-text">🎬 The Ad Studio</div>
                                <button onclick="goTo('generator')" class="px-6 py-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-bold hover:shadow-lg transition">
                                    Create Ad
                                </button>
                            </div>
                        </nav>

                        <!-- Hero -->
                        <div class="max-w-6xl mx-auto px-8 py-24 text-center">
                            <h1 class="text-6xl font-black text-white mb-6">
                                Create Stunning Product Ads
                                <br/>
                                <span class="gradient-text">In Minutes</span>
                            </h1>
                            <p class="text-xl text-gray-200 mb-8 max-w-2xl mx-auto">
                                Upload your product photos, add your copy, and get a professional 25-30 second ad video ready to post.
                            </p>
                            <button onclick="goTo('generator')" class="px-12 py-4 bg-white text-purple-600 font-bold text-lg rounded-lg hover:shadow-2xl transition inline-block">
                                Start Creating Now →
                            </button>
                        </div>

                        <!-- Features -->
                        <div class="max-w-6xl mx-auto px-8 py-16">
                            <h2 class="text-4xl font-bold text-white text-center mb-16">Why The Ad Studio?</h2>
                            <div class="grid md:grid-cols-3 gap-8">
                                <div class="bg-white p-8 rounded-lg shadow-lg">
                                    <div class="text-4xl mb-4">📸</div>
                                    <h3 class="text-xl font-bold mb-3">No Filming Needed</h3>
                                    <p class="text-gray-600">Just your product photos and copy - no camera, no editing software.</p>
                                </div>
                                <div class="bg-white p-8 rounded-lg shadow-lg">
                                    <div class="text-4xl mb-4">⚡</div>
                                    <h3 class="text-xl font-bold mb-3">Super Fast</h3>
                                    <p class="text-gray-600">Generate 25-30 second ads in minutes.</p>
                                </div>
                                <div class="bg-white p-8 rounded-lg shadow-lg">
                                    <div class="text-4xl mb-4">🎨</div>
                                    <h3 class="text-xl font-bold mb-3">Professional Quality</h3>
                                    <p class="text-gray-600">Animated intros, feature callouts, music, and a branded CTA.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // Generator Page
            if (currentPage === 'generator') {
                root.innerHTML = `
                    <div class="min-h-screen bg-gray-50">
                        <!-- Header -->
                        <nav class="bg-white shadow-lg">
                            <div class="max-w-6xl mx-auto px-8 py-6 flex justify-between items-center">
                                <button onclick="goTo('landing')" class="text-2xl font-bold gradient-text">🎬 The Ad Studio</button>
                                <button onclick="goTo('landing')" class="text-gray-600 hover:text-gray-900">← Back</button>
                            </div>
                        </nav>

                        <!-- Main Content -->
                        <div class="max-w-6xl mx-auto px-8 py-16">
                            <h1 class="text-4xl font-bold text-center mb-8">Create Your Product Ad</h1>

                            <!-- Mode Switcher -->
                            <div class="flex justify-center gap-4 mb-16">
                                <button onclick="switchMode('classic')" class="px-6 py-3 rounded-lg font-bold transition ${adMode === 'classic' ? 'bg-purple-600 text-white shadow-lg' : 'bg-white text-gray-600 border-2 border-gray-200'}">
                                    🎬 Classic Ad
                                </button>
                                <button onclick="switchMode('montage')" class="px-6 py-3 rounded-lg font-bold transition ${adMode === 'montage' ? 'bg-purple-600 text-white shadow-lg' : 'bg-white text-gray-600 border-2 border-gray-200'}">
                                    ⚡ UGC Montage
                                </button>
                                <button onclick="switchMode('ugc')" class="px-6 py-3 rounded-lg font-bold transition ${adMode === 'ugc' ? 'bg-purple-600 text-white shadow-lg' : 'bg-white text-gray-600 border-2 border-gray-200'}">
                                    🧑‍🎤 AI Avatar
                                </button>
                            </div>

                            ${adMode === 'classic' ? `
                            <div class="grid md:grid-cols-2 gap-12">
                                <!-- Form -->
                                <div class="bg-white p-8 rounded-lg shadow-lg">
                                    <h2 class="text-2xl font-bold mb-6">Ad Details</h2>

                                    <div class="space-y-6">
                                        <!-- Product Title -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Product Name *</label>
                                            <input type="text"
                                                placeholder="e.g., Amazing Headphones"
                                                value="${formData.title}"
                                                onchange="formData.title = this.value"
                                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none"
                                            />
                                        </div>

                                        <!-- Features -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Key Features * (comma separated)</label>
                                            <textarea
                                                placeholder="e.g., Noise Cancelling, 30hr Battery, Premium Sound"
                                                rows="4"
                                                onchange="formData.features = this.value"
                                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none resize-none"
                                            >${formData.features}</textarea>
                                        </div>

                                        <!-- CTA -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Call to Action</label>
                                            <input type="text"
                                                placeholder="e.g., Order Now, Buy Today, Get Yours"
                                                value="${formData.cta}"
                                                onchange="formData.cta = this.value"
                                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none"
                                            />
                                        </div>

                                        <!-- Image Upload -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Product Image *</label>
                                            <div class="border-2 border-dashed border-purple-300 rounded-lg p-8 text-center cursor-pointer hover:border-purple-600 transition">
                                                <input type="file"
                                                    accept="image/*"
                                                    onchange="handleImageUpload(event)"
                                                    class="hidden"
                                                    id="imageInput"
                                                />
                                                <label for="imageInput" class="cursor-pointer">
                                                    <div class="text-4xl mb-2">📸</div>
                                                    <p class="text-gray-600">Click to upload image</p>
                                                    <p class="text-sm text-gray-500 mt-2">PNG, JPG, WebP</p>
                                                </label>
                                            </div>
                                            ${formData.image ? `<p class="text-green-600 mt-2">✅ ${formData.image.name}</p>` : ''}
                                        </div>

                                        <!-- Generate Button -->
                                        <button
                                            onclick="generateAd()"
                                            ${isGenerating ? 'disabled' : ''}
                                            class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-lg rounded-lg hover:shadow-lg transition ${isGenerating ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}"
                                        >
                                            ${isGenerating ? '<div class="flex items-center justify-center gap-2"><div class="spinner"></div>Creating Your Ad...</div>' : '🎬 Generate 25-30s Ad'}
                                        </button>
                                    </div>
                                </div>

                                <!-- Preview -->
                                <div>
                                    <h2 class="text-2xl font-bold mb-6">Preview</h2>
                                    <div class="preview-box">
                                        ${formData.imagePreview
                                            ? `<img src="${formData.imagePreview}" class="preview-image" />`
                                            : `<div class="flex items-center justify-center h-full text-white text-center"><div>
                                                <div class="text-6xl mb-4">🖼️</div>
                                                <p>Upload your product image here</p>
                                            </div></div>`
                                        }
                                    </div>

                                    <div class="mt-8 bg-blue-50 p-6 rounded-lg border-l-4 border-blue-500">
                                        <h3 class="font-bold text-blue-900 mb-2">📝 How It Works:</h3>
                                        <ol class="text-sm text-blue-800 space-y-2 list-decimal list-inside">
                                            <li>Upload your product image</li>
                                            <li>Add product name & features</li>
                                            <li>Click Generate</li>
                                            <li>Get a stunning 40-sec ad video</li>
                                            <li>Auto-download ready to share!</li>
                                        </ol>
                                    </div>
                                </div>
                            </div>
                            ` : adMode === 'montage' ? `
                            <div class="grid md:grid-cols-2 gap-12">
                                <!-- Montage Form -->
                                <div class="bg-white p-8 rounded-lg shadow-lg">
                                    <h2 class="text-2xl font-bold mb-6">Montage Details</h2>

                                    <div class="space-y-6">
                                        <!-- Product Photos -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Product Photos * (multiple, fast-cut style)</label>
                                            <div class="border-2 border-dashed border-purple-300 rounded-lg p-8 text-center cursor-pointer hover:border-purple-600 transition">
                                                <input type="file"
                                                    accept="image/*"
                                                    multiple
                                                    onchange="handleMontageImagesUpload(event)"
                                                    class="hidden"
                                                    id="montageImagesInput"
                                                />
                                                <label for="montageImagesInput" class="cursor-pointer">
                                                    <div class="text-4xl mb-2">📸</div>
                                                    <p class="text-gray-600">Click to upload several photos</p>
                                                    <p class="text-sm text-gray-500 mt-2">Close-up shots work best for fast cuts</p>
                                                </label>
                                            </div>
                                            ${montageData.images.length > 0 ? `<p class="text-green-600 mt-2">✅ ${montageData.images.length} image(s) selected</p>` : ''}
                                        </div>

                                        <!-- Music Upload -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Background Music * (your own royalty-free track)</label>
                                            <div class="border-2 border-dashed border-purple-300 rounded-lg p-8 text-center cursor-pointer hover:border-purple-600 transition">
                                                <input type="file"
                                                    accept="audio/*"
                                                    onchange="handleMusicUpload(event)"
                                                    class="hidden"
                                                    id="musicInput"
                                                />
                                                <label for="musicInput" class="cursor-pointer">
                                                    <div class="text-4xl mb-2">🎵</div>
                                                    <p class="text-gray-600">Click to upload music</p>
                                                    <p class="text-sm text-gray-500 mt-2">MP3, WAV, M4A — you must own the rights to it</p>
                                                </label>
                                            </div>
                                            ${montageData.musicName ? `<p class="text-green-600 mt-2">✅ ${montageData.musicName}</p>` : ''}
                                        </div>

                                        <!-- On-screen Title -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">On-screen Title / Hook (optional)</label>
                                            <input type="text"
                                                placeholder="e.g., Amazing Headphones"
                                                value="${montageData.title}"
                                                onchange="montageData.title = this.value"
                                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none"
                                            />
                                        </div>

                                        <!-- Key Features -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Key Features (optional, comma separated — shown as clean slides, up to 3)</label>
                                            <textarea
                                                placeholder="e.g., Non-Slip Grip, Dishwasher Safe, BPA Free"
                                                rows="3"
                                                onchange="montageData.features = this.value"
                                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none resize-none"
                                            >${montageData.features}</textarea>
                                        </div>

                                        <!-- On-screen CTA -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">On-screen CTA (optional)</label>
                                            <input type="text"
                                                placeholder="e.g., Shop Now, Link in Bio"
                                                value="${montageData.cta}"
                                                onchange="montageData.cta = this.value"
                                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none"
                                            />
                                        </div>

                                        <!-- Store Link -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Store Link (shown as text under CTA — videos can't have real clickable links)</label>
                                            <input type="text"
                                                placeholder="e.g., yourstore.com"
                                                value="${montageData.link}"
                                                onchange="montageData.link = this.value"
                                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none"
                                            />
                                        </div>

                                        <!-- Ad Length -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Ad Length (optional — leave blank to follow your music track, 25-30s)</label>
                                            <input type="number" min="6" max="120" step="1"
                                                placeholder="e.g., 15 for a TikTok cut, 60 for a longer ad"
                                                value="${montageData.duration}"
                                                onchange="montageData.duration = this.value"
                                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none"
                                            />
                                        </div>

                                        <!-- Generate Button -->
                                        <button
                                            onclick="generateMontage()"
                                            ${isGenerating ? 'disabled' : ''}
                                            class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-lg rounded-lg hover:shadow-lg transition ${isGenerating ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}"
                                        >
                                            ${isGenerating ? '<div class="flex items-center justify-center gap-2"><div class="spinner"></div>Creating Your Montage...</div>' : '⚡ Generate Fast-Cut Montage'}
                                        </button>
                                    </div>
                                </div>

                                <!-- Preview -->
                                <div>
                                    <h2 class="text-2xl font-bold mb-6">Preview</h2>
                                    <div class="preview-box" style="aspect-ratio: 9/16; max-width: 280px; margin: 0 auto;">
                                        ${montageData.imagePreviews.length > 0
                                            ? `<img src="${montageData.imagePreviews[0]}" class="preview-image" />`
                                            : `<div class="flex items-center justify-center h-full text-white text-center"><div>
                                                <div class="text-6xl mb-4">⚡</div>
                                                <p>Upload photos to preview</p>
                                            </div></div>`
                                        }
                                    </div>
                                    ${montageData.imagePreviews.length > 1 ? `
                                    <div class="flex gap-2 mt-4 flex-wrap justify-center">
                                        ${montageData.imagePreviews.slice(1).map(src => `<img src="${src}" class="w-16 h-16 object-cover rounded-lg" />`).join('')}
                                    </div>
                                    ` : ''}

                                    <div class="mt-8 bg-blue-50 p-6 rounded-lg border-l-4 border-blue-500">
                                        <h3 class="font-bold text-blue-900 mb-2">📝 How It Works:</h3>
                                        <ol class="text-sm text-blue-800 space-y-2 list-decimal list-inside">
                                            <li>Upload several close-up product photos</li>
                                            <li>Upload a royalty-free music track you have rights to</li>
                                            <li>Optionally add an on-screen title & CTA</li>
                                            <li>Click Generate</li>
                                            <li>Get a fast-cut, music-synced montage video</li>
                                        </ol>
                                    </div>
                                </div>
                            </div>
                            ` : `
                            <div class="grid md:grid-cols-2 gap-12">
                                <!-- UGC Avatar Form -->
                                <div class="bg-white p-8 rounded-lg shadow-lg">
                                    <h2 class="text-2xl font-bold mb-6">AI Avatar Details</h2>

                                    ${ugcData.avatarsError ? `
                                    <div class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 text-sm text-red-800">
                                        <p class="font-bold mb-1">⚠️ Creatify not available</p>
                                        <p>${ugcData.avatarsError}</p>
                                        <p class="mt-2">Set <code>CREATIFY_API_ID</code> and <code>CREATIFY_API_KEY</code> on the backend (requires a Creatify Pro plan or higher) and reload.</p>
                                    </div>
                                    ` : ''}

                                    <div class="space-y-6">
                                        <!-- Avatar Picker -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">AI Avatar / Presenter *</label>
                                            ${!ugcData.avatarsLoaded ? `<p class="text-sm text-gray-500">Loading avatars...</p>` : ''}
                                            ${ugcData.avatarsLoaded && ugcData.avatars.length === 0 && !ugcData.avatarsError ? `<p class="text-sm text-gray-500">No avatars available in this workspace.</p>` : ''}
                                            <div class="grid grid-cols-3 sm:grid-cols-4 gap-3 max-h-72 overflow-y-auto pr-1">
                                                ${ugcData.avatars.map(a => {
                                                    const id = a.id || a.avatar_id || '';
                                                    const label = a.name || id;
                                                    const thumb = a.preview_image || a.thumbnail_url || a.image_url || '';
                                                    const selected = ugcData.avatarId === id;
                                                    return `
                                                    <button type="button" onclick="ugcData.avatarId = '${id}'; render();"
                                                        class="rounded-lg border-2 overflow-hidden text-left transition ${selected ? 'border-purple-600 ring-2 ring-purple-300' : 'border-gray-200 hover:border-purple-300'}">
                                                        <div class="aspect-square bg-gray-100 flex items-center justify-center">
                                                            ${thumb ? `<img src="${thumb}" class="w-full h-full object-cover" />` : `<span class="text-2xl">🧑</span>`}
                                                        </div>
                                                        <p class="text-xs font-semibold px-2 py-1 truncate">${label}</p>
                                                    </button>
                                                    `;
                                                }).join('')}
                                            </div>
                                        </div>

                                        <!-- Voice Picker -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Voice (optional — defaults to the avatar's own voice)</label>
                                            <select
                                                onchange="ugcData.voiceId = this.value"
                                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none"
                                            >
                                                <option value="">Default voice</option>
                                                ${ugcData.voiceOptions.map(v => `<option value="${v.id}" ${ugcData.voiceId === v.id ? 'selected' : ''}>${v.label}</option>`).join('')}
                                            </select>
                                        </div>

                                        <!-- Auto-generate script -->
                                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                                            <p class="text-sm font-bold mb-3">✍️ Don't want to write it? Generate a starting script from product details:</p>
                                            <div class="space-y-2">
                                                <input type="text" placeholder="Product name"
                                                    value="${ugcData.scriptTitle}"
                                                    onchange="ugcData.scriptTitle = this.value"
                                                    class="w-full px-3 py-2 text-sm border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none" />
                                                <input type="text" placeholder="Key features (comma separated)"
                                                    value="${ugcData.scriptFeatures}"
                                                    onchange="ugcData.scriptFeatures = this.value"
                                                    class="w-full px-3 py-2 text-sm border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none" />
                                                <input type="text" placeholder="Call to action (e.g., grab yours today)"
                                                    value="${ugcData.scriptCta}"
                                                    onchange="ugcData.scriptCta = this.value"
                                                    class="w-full px-3 py-2 text-sm border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none" />
                                                <button type="button" onclick="generateUgcScript()"
                                                    class="w-full py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm font-bold rounded-lg transition">
                                                    Generate Script
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Script -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Script * (what the avatar says)</label>
                                            <textarea
                                                placeholder="e.g., Okay so I've been using these headphones for two weeks now and honestly? Best purchase this year..."
                                                rows="6"
                                                onchange="ugcData.script = this.value"
                                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none resize-none"
                                            >${ugcData.script}</textarea>
                                        </div>

                                        <!-- Aspect Ratio -->
                                        <div>
                                            <label class="block text-sm font-bold mb-2">Aspect Ratio</label>
                                            <select
                                                onchange="ugcData.aspectRatio = this.value"
                                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none"
                                            >
                                                <option value="9:16" ${ugcData.aspectRatio === '9:16' ? 'selected' : ''}>9:16 - TikTok / Reels / Shorts</option>
                                                <option value="1:1" ${ugcData.aspectRatio === '1:1' ? 'selected' : ''}>1:1 - Square</option>
                                                <option value="16:9" ${ugcData.aspectRatio === '16:9' ? 'selected' : ''}>16:9 - Landscape / YouTube</option>
                                            </select>
                                        </div>

                                        <!-- Generate Button -->
                                        <button
                                            onclick="generateUgc()"
                                            ${isGenerating ? 'disabled' : ''}
                                            class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold text-lg rounded-lg hover:shadow-lg transition ${isGenerating ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}"
                                        >
                                            ${isGenerating ? `<div class="flex items-center justify-center gap-2"><div class="spinner"></div>${ugcData.status === 'running' ? 'Rendering avatar video...' : 'Queuing render...'}</div>` : '🧑‍🎤 Generate Avatar Video'}
                                        </button>

                                        ${ugcData.error ? `<p class="text-red-600 text-sm">❌ ${ugcData.error}</p>` : ''}

                                        ${ugcData.videoUrl ? `
                                        <a href="${ugcData.videoUrl}" class="block text-center py-3 bg-green-600 text-white font-bold rounded-lg hover:shadow-lg transition">
                                            ✅ Video ready — Download
                                        </a>
                                        ` : ''}
                                    </div>
                                </div>

                                <!-- Info -->
                                <div>
                                    <h2 class="text-2xl font-bold mb-6">About this mode</h2>
                                    <div class="preview-box" style="aspect-ratio: 9/16; max-width: 280px; margin: 0 auto;">
                                        <div class="flex items-center justify-center h-full text-white text-center"><div>
                                            <div class="text-6xl mb-4">🧑‍🎤</div>
                                            <p>Real AI-avatar presenter video</p>
                                        </div></div>
                                    </div>

                                    <div class="mt-8 bg-blue-50 p-6 rounded-lg border-l-4 border-blue-500">
                                        <h3 class="font-bold text-blue-900 mb-2">📝 How It Works:</h3>
                                        <ol class="text-sm text-blue-800 space-y-2 list-decimal list-inside">
                                            <li>Pick an AI avatar and (optionally) a voice</li>
                                            <li>Write the script it should speak</li>
                                            <li>Click Generate</li>
                                            <li>Creatify renders a real talking-avatar video (this can take a few minutes)</li>
                                            <li>Download once it's done</li>
                                        </ol>
                                        <p class="text-xs text-blue-700 mt-4">Unlike Classic and UGC Montage (which composite your own photos), this mode calls out to <a href="https://creatify.ai" class="underline" target="_blank">Creatify</a>'s API to generate an actual AI presenter. Requires a Creatify Pro plan or higher.</p>
                                    </div>
                                </div>
                            </div>
                            `}
                        </div>
                    </div>
                `;
                return;
            }

            // Success Page
            if (currentPage === 'success') {
                root.innerHTML = `
                    <div class="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div class="bg-white rounded-lg shadow-2xl p-12 text-center max-w-md">
                            <div class="text-6xl mb-6">🎉</div>
                            <h1 class="text-3xl font-bold mb-4">Ad Created!</h1>
                            <p class="text-gray-600 mb-8">
                                Your 25-30 second product ad is ready. Your video is downloading automatically...
                            </p>
                            <div class="space-y-4">
                                <a href="${formData.videoUrl}" class="block py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold rounded-lg hover:shadow-lg transition">
                                    ⬇️ Download Video
                                </a>
                                <button onclick="goTo('generator')" class="w-full py-3 border-2 border-purple-600 text-purple-600 font-bold rounded-lg hover:bg-purple-50 transition">
                                    Create Another Ad
                                </button>
                            </div>

                            <div class="mt-12 pt-8 border-t border-gray-200">
                                <p class="text-sm text-gray-600 mb-4">💡 What to do next:</p>
                                <ul class="text-sm text-gray-600 space-y-2 text-left">
                                    <li>✓ Download your ad</li>
                                    <li>✓ Post on social media (TikTok, Insta, YouTube)</li>
                                    <li>✓ Use in marketing campaigns</li>
                                    <li>✓ Share with your team</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }
        }

        function goTo(page) {
            currentPage = page;
            render();
        }

        // Initial render
        render();
    </script>
</body>
</html>
